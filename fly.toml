app = "con9sole-bartender"
primary_region = "sin"

[processes]
app = "python bot.py"

[vm]
cpu_kind = "shared"
cpus = 1
memory_mb = 256

[experimental]
auto_rollback = true
auto_stop_machines = false   # Bot 長駐
auto_start_machines = true   # 有請求會自動啟動


[mounts]
  source = "con9sole_data"
  destination = "/data"

[env]
  NEWS_CATEGORY_MIGRATION = "20261114-v1"
  STORE_NEWS_CONFIG = "docs/store_news.json"
  STORE_NEWS_PUBLIC = "0"
  RSS_PERSONAL_PUBLIC = "1"
  HELPER_SANDBOX = "1"
  RSS_DELIVERY_SOURCES = "ps,xbox,4gamers"
  RSS_DIGEST_CONFIG = "docs/rss_simulation.json"
  REQUIRE_PERSISTENT_DATA = "1"
  DRINK_STATE_PATH = "/data/drink_state.json"
  ACTIVITY_REMINDER_PATH = "/data/activity_reminders.json"
