app = "con9sole-bartender"
primary_region = "sin"

[processes]
app = "python bot.py"

[vm]
cpu_kind = "shared"
cpus = 1
memory_mb = 256

[experimental]
auto_rollback = true
auto_stop_machines = false   # Bot 長駐
auto_start_machines = true   # 有請求會自動啟動


[mounts]
  source = "con9sole_data"
  destination = "/data"

[env]
  REQUIRE_PERSISTENT_DATA = "1"
  DRINK_STATE_PATH = "/data/drink_state.json"
  ACTIVITY_REMINDER_PATH = "/data/activity_reminders.json"
