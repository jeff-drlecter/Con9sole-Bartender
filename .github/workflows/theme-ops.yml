name: Theme collections release operations
on:
  push:
    branches: [codex/theme-collections-ops]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Verify release, old data and persistence on an isolated copy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python3 ops/theme_verify_runner.py
