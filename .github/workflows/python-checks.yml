name: Python checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Verify Python source, agent configuration and regression suite
        run: timeout 120 python scripts/verify.py all

      - name: Replay the four-person draft and capture its SDK responses
        id: replay
        if: github.event_name == 'pull_request' && !cancelled() && steps.dependencies.outcome == 'success'
        run: |
          if [ -z "$(fc-list :lang=zh family)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
          python scripts/verify.py draft-replay --artifacts-dir "$RUNNER_TEMP/draft-evidence"

      - name: Save draft replay evidence
        if: github.event_name == 'pull_request' && !cancelled() && steps.replay.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-draft-replay
          path: |
            ${{ runner.temp }}/draft-evidence/draft-replay-*/trace.json
            ${{ runner.temp }}/draft-evidence/draft-replay-*/replay.html
            ${{ runner.temp }}/draft-evidence/draft-replay-*/replay.png
          if-no-files-found: warn
          retention-days: 14

      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Build and verify container security
        run: |
          mkdir -p migration_private
          python -c "from pathlib import Path; Path('migration_private/never-package.txt').write_text('build exclusion probe'); Path('.env.security-check').write_text('not a credential')"
          docker build -t bartender-security-test .
          docker run --rm --entrypoint python bartender-security-test -c "from pathlib import Path; assert not Path('/app/migration_private').exists(); assert not Path('/app/.env.security-check').exists()"
          docker volume create bartender-security-test
          docker run --rm --user 0 --entrypoint python -v bartender-security-test:/data bartender-security-test -c "from pathlib import Path; Path('/data/existing.txt').write_text('preserve me')"
          docker run --rm -v bartender-security-test:/data bartender-security-test python scripts/verify_runtime_identity.py --self-test
          docker volume rm bartender-security-test
