name: Python checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run unit tests
        run: timeout 120 python -m unittest discover -s tests -v

      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Build and verify container security
        run: |
          mkdir -p migration_private
          python -c "from pathlib import Path; Path('migration_private/never-package.txt').write_text('build exclusion probe'); Path('.env.security-check').write_text('not a credential')"
          docker build -t bartender-security-test .
          docker run --rm --entrypoint python bartender-security-test -c "from pathlib import Path; assert not Path('/app/migration_private').exists(); assert not Path('/app/.env.security-check').exists()"
          docker volume create bartender-security-test
          docker run --rm --user 0 --entrypoint python -v bartender-security-test:/data bartender-security-test -c "from pathlib import Path; Path('/data/existing.txt').write_text('preserve me')"
          docker run --rm -v bartender-security-test:/data bartender-security-test python scripts/verify_runtime_identity.py --self-test
          docker volume rm bartender-security-test
