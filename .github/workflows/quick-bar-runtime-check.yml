name: Quick Bar deployed runtime verification
on:
  push:
    branches: [codex/quick-bar-v1]
permissions:
  contents: read
jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Verify deployed source, database, Discord API and startup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import datetime, json, re, shlex, subprocess, time
          expected_sha = '7c6195e5d3b3ca5dc8fe43d419ceb8846b072061'
          for attempt in range(12):
              process = subprocess.run(['flyctl', 'status', '--app', 'con9sole-bartender', '--json'], check=True, capture_output=True, text=True)
              status = json.loads(process.stdout)
              machines = status.get('Machines', [])
              matching = [m for m in machines if m.get('state') == 'started' and m.get('image_ref', {}).get('labels', {}).get('GH_SHA') == expected_sha]
              if len(matching) == 1:
                  break
              time.sleep(10)
          else:
              raise SystemExit('Expected release image is not running')
          print(json.dumps({'release_version': status.get('Version'), 'machine_state': matching[0]['state'], 'image': matching[0]['image_ref'].get('tag'), 'sha': expected_sha}))
          command = 'python -c ' + shlex.quote("import base64;exec(base64.b64decode(''))")
          subprocess.run(['flyctl', 'ssh', 'console', '--app', 'con9sole-bartender', '-C', command], check=True)
          result = subprocess.run(['flyctl', 'logs', '--app', 'con9sole-bartender', '--json', '--no-tail'], check=True, capture_output=True, text=True)
          try:
              parsed = json.loads(result.stdout)
              records = parsed if isinstance(parsed, list) else [parsed]
              kind = type(parsed).__name__
          except ValueError:
              records = []
              for line in result.stdout.splitlines():
                  try:
                      records.append(json.loads(line))
                  except ValueError:
                      pass
              kind = 'jsonlines'
          def describe(value, depth=0):
              if depth > 2:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {key: (item if any(part in key.lower() for part in ('time', 'stamp')) and isinstance(item, (str, int, float)) else describe(item, depth+1)) for key,item in value.items()}
              if isinstance(value, list):
                  return [describe(item, depth+1) for item in value[:1]]
              return type(value).__name__
          print(json.dumps({'log_format': kind, 'characters': len(result.stdout), 'line_count': len(result.stdout.splitlines()), 'record_count': len(records), 'first_record_shape': describe(records[0]) if records else None}))
          PYCODE
