name: 🚀 Fly Deploy (Remote Builder Fallback)

on:
  push:
    branches: [ main ]   # push 上 main 時自動部署
  workflow_dispatch:      # 可以手動觸發

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 30
    runs-on: ubuntu-latest

    concurrency:
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Verify Python source, agent configuration and regression suite
        run: timeout 120 python scripts/verify.py all

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
        with:
          version: "0.5.7"

      # （可選）顯示 fly.toml 幫助除錯
      - name: Show fly.toml
        run: cat fly.toml

      - name: Record and require one existing machine with persistent data
        id: existing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl machine list --app con9sole-bartender --json | python scripts/release_machine.py

      - name: Build release image without starting another Bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --build-only --push --remote-only --image-label "git-$GITHUB_SHA" --build-arg "APP_COMMIT=$GITHUB_SHA" || flyctl deploy --build-only --push --local-only --image-label "git-$GITHUB_SHA" --build-arg "APP_COMMIT=$GITHUB_SHA"

      - name: Require idle persisted activity and resolved delivery before deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          preflight_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/inspect_round_readiness.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$preflight_command --require-idle"
          health_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/verify_community_runtime.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$health_command"

      - name: Verify existing news migration before deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          preflight_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/verify_news_category_state.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$preflight_command"

      - name: Record current image and verify persistent backup before deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app con9sole-bartender
          backup_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/backup_runtime.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$backup_command $GITHUB_SHA"

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Recheck after backup; never retry an uncertain deployment as a build fallback.
          preflight_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/inspect_round_readiness.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$preflight_command --require-idle"
          # Listen across the cutover before the old process disappears from Fly's log buffer.
          result="$RUNNER_TEMP/deploy-gap-$GITHUB_RUN_ATTEMPT"
          python scripts/measure_deploy_gap.py "${{ steps.existing.outputs.machine }}" "$GITHUB_SHA" "$(date -u +%FT%T.%NZ)" "$result" >> "$GITHUB_STEP_SUMMARY" &
          observer=$!
          finish_measurement() {
            local deploy_status=$?
            if ! (echo "$deploy_status" > "$result.tmp" && mv "$result.tmp" "$result"); then
              kill "$observer" 2>/dev/null || true
            fi
            wait "$observer" || echo 'Discord deployment gap unavailable (observer failed).' >> "$GITHUB_STEP_SUMMARY"
            return "$deploy_status"
          }
          trap finish_measurement EXIT
          flyctl deploy --image "registry.fly.io/con9sole-bartender:git-$GITHUB_SHA" --ha=false --update-only --only-machines "${{ steps.existing.outputs.machine }}" --strategy rolling

      - name: Verify Fly.io machine status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine list --app con9sole-bartender --json | python scripts/release_machine.py
          revision_command="$(python -c 'import shlex; print("python -c " + shlex.quote("import os,sys; actual=os.environ.get(\"APP_COMMIT\"); print(\"runtime_commit=\"+str(actual)); assert actual==sys.argv[1], \"Unexpected runtime commit\""))')"
          flyctl ssh console --app con9sole-bartender -C "$revision_command $GITHUB_SHA"

      - name: Verify news migration marker without changing permissions
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_news_category_state.py'

      - name: Verify RSS sandbox panel when enabled
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_rss_sandbox.py'

      - name: Verify RSS member browser without sending messages
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_rss_public.py'

      - name: Verify store source collection without sending messages
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_store_sources.py'

      - name: Verify Helper sandbox when enabled
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_helper_sandbox.py'

      - name: Verify community data health and operational policy without private statistics
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_community_runtime.py'

      - name: Verify application runs without root privileges
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_runtime_identity.py'

      - name: Verify member hints configuration and persistent store without sending messages
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_member_hints.py'

      - name: Verify Twitch alerts credentials, roster and command sync without sending alerts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app con9sole-bartender -C 'python scripts/verify_stream_alerts.py'
