name: Round integration read-only inspection

on:
  push:
    branches: [codex/round-20261116-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/round-20261116-integration' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: '0.5.7'
      - name: Inspect existing machine and aggregate receipt/activity evidence
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app con9sole-bartender
          inspection_command="$(python -c 'import shlex; from pathlib import Path; print("python -c " + shlex.quote(Path("scripts/inspect_round_readiness.py").read_text()))')"
          flyctl ssh console --app con9sole-bartender -C "$inspection_command"
