name: Collection persistence after actual bot restart
on:
  push:
    branches: [codex/collection-milestones]
permissions:
  contents: read
concurrency:
  group: collection-restart-verification
  cancel-in-progress: false
jobs:
  restart-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Snapshot, restart bot and verify saved collection data
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import base64,datetime,json,os,re,shlex,subprocess,time
          expected_sha='f5762d161314006fcaf3d78cc3ff2675878386c4'
          probe="import json,os,sqlite3,time\nfrom pathlib import Path\nos.chdir('/app')\nfrom core.storage_paths import STATS_DB\nfolder=Path('/data/backups')/('collection-restart-'+RUN_ID)\nfolder.mkdir(parents=True,exist_ok=True)\nbackup=folder/'before.sqlite3'\nmeta=folder/'before.json'\ndef connect(path):\n    return sqlite3.connect(Path(path).resolve().as_uri()+'?mode=ro',uri=True)\ndef counts(conn):\n    return {table:conn.execute('SELECT COUNT(*) FROM '+table).fetchone()[0] for table in ('drink_events','drink_collection','drink_milestones','drink_collection_titles')}\nboot=Path('/proc/sys/kernel/random/boot_id').read_text().strip()\nif MODE=='before':\n    assert not backup.exists(), 'Snapshot already exists; do not overwrite baseline'\n    conn=connect(STATS_DB)\n    dest=sqlite3.connect(backup)\n    try:\n        assert conn.execute('PRAGMA quick_check').fetchone()[0]=='ok'\n        conn.backup(dest)\n        before_counts=counts(dest)\n    finally:\n        dest.close();conn.close()\n    meta.write_text(json.dumps({'boot_id':boot,'counts':before_counts}))\n    print(json.dumps({'phase':'before','backup':str(backup),'counts':before_counts}))\nelse:\n    baseline=json.loads(meta.read_text())\n    assert boot!=baseline['boot_id'], 'Machine has not actually rebooted'\n    old=connect(backup)\n    current=connect(STATS_DB)\n    try:\n        current.execute('BEGIN')\n        assert current.execute('PRAGMA quick_check').fetchone()[0]=='ok'\n        comparisons={}\n        for table in ('drink_events','drink_collection','drink_milestones','drink_collection_titles'):\n            before=set(old.execute('SELECT * FROM '+table))\n            after=set(current.execute('SELECT * FROM '+table))\n            comparisons[table]={'before':len(before),'after':len(after),'missing_or_changed':len(before-after)}\n            assert not before-after, 'Pre-restart rows missing or changed: '+table\n        bad=current.execute('SELECT COUNT(*) FROM drink_collection_titles t LEFT JOIN drink_milestones m ON m.guild_key=t.guild_key AND m.user_id=t.user_id AND m.milestone_id=t.milestone_id WHERE m.milestone_id IS NULL').fetchone()[0]\n        assert bad==0,'Selected title has no corresponding earned milestone'\n        labels=[row[0] for row in current.execute('SELECT m.label FROM drink_collection_titles t JOIN drink_milestones m ON m.guild_key=t.guild_key AND m.user_id=t.user_id AND m.milestone_id=t.milestone_id ORDER BY m.label')]\n        print(json.dumps({'phase':'after','machine_reboot_confirmed':True,'sqlite_integrity':'ok','comparisons':comparisons,'saved_title_labels':labels},ensure_ascii=False))\n    finally:\n        current.close();old.close()\n"
          run_id=os.environ['GITHUB_RUN_ID']
          def status():
              return json.loads(subprocess.run(['flyctl','status','--app','con9sole-bartender','--json'],capture_output=True,text=True,check=True).stdout)
          def remote(mode):
              source='RUN_ID='+repr(run_id)+'\nMODE='+repr(mode)+'\n'+probe
              command='python -c '+shlex.quote('import base64;exec(base64.b64decode('+repr(base64.b64encode(source.encode()).decode())+'))')
              subprocess.run(['flyctl','ssh','console','--app','con9sole-bartender','-C',command],check=True)
          initial=status()
          machines=[m for m in initial.get('Machines',[]) if m.get('state')=='started']
          assert len(machines)==1,'Expected exactly one running bot machine'
          machine=machines[0]
          assert machine.get('image_ref',{}).get('labels',{}).get('GH_SHA')==expected_sha,'Unexpected live release'
          remote('before')
          restart_started=datetime.datetime.now(datetime.timezone.utc)
          subprocess.run(['flyctl','machine','restart',machine['id'],'--app','con9sole-bartender'],check=True)
          for attempt in range(24):
              final=status()
              active=[m for m in final.get('Machines',[]) if m.get('id')==machine['id'] and m.get('state')=='started']
              if active: break
              time.sleep(5)
          else: raise SystemExit('Bot machine did not return to started')
          assert active[0].get('image_ref',{}).get('labels',{}).get('GH_SHA')==expected_sha,'Release changed unexpectedly'
          remote('after')
          print(json.dumps({'release':final.get('Version'),'sha':expected_sha,'state':active[0]['state']}))
          
          cutoff=restart_started
          for attempt in range(3):
              result=subprocess.run(['flyctl','logs','--app','con9sole-bartender','--json','--no-tail'],capture_output=True,text=True,check=True)
              raw=re.sub(r'\x1b\[[0-9;]*m','',result.stdout)
              decoder=json.JSONDecoder()
              records=[]
              index=0
              while index<len(raw):
                  while index<len(raw) and raw[index].isspace(): index+=1
                  try:
                      value,index=decoder.raw_decode(raw,index)
                      records.extend(value if isinstance(value,list) else [value])
                  except ValueError:
                      index=raw.find('{',index+1)
                      if index<0: break
              def fields(value):
                  if isinstance(value,dict):
                      for key,item in value.items():
                          yield key.lower(),item
                          yield from fields(item)
                  elif isinstance(value,list):
                      for item in value: yield from fields(item)
              messages=[]
              for record in records:
                  pairs=list(fields(record))
                  stamps=[]
                  for key,value in pairs:
                      if key not in ('timestamp','time','@timestamp'): continue
                      try:
                          if isinstance(value,str):
                              stamp=datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
                              if stamp.tzinfo is None: stamp=stamp.replace(tzinfo=datetime.timezone.utc)
                          elif isinstance(value,(float,int)):
                              while value>100000000000: value/=1000
                              stamp=datetime.datetime.fromtimestamp(value,datetime.timezone.utc)
                          else: continue
                          stamps.append(stamp)
                      except (ValueError,OverflowError): pass
                  if any(stamp>=cutoff for stamp in stamps):
                      messages.extend(value for key,value in pairs if key in ('message','msg') and isinstance(value,str))
              joined='\n'.join(messages)
              cogs=sorted(set(re.findall(r'Loaded extension: cogs\.([a-z_]+)',joined)))
              report={'loaded_cogs':len(cogs),'discord_ready':'Logged in as' in joined,'guild_sync':'App commands synced to guild' in joined,'vc_sweeper':'Temp VC safety sweeper started' in joined,'failed_loading':'Failed loading' in joined,'error_lines':sum(' ERROR ' in m for m in messages)}
              if len(cogs)==17 and all(report[k] for k in ('discord_ready','guild_sync','vc_sweeper')): break
              time.sleep(5)
          print(json.dumps(report))
          assert report['loaded_cogs']==17 and all(report[k] for k in ('discord_ready','guild_sync','vc_sweeper')) and not report['failed_loading'] and report['error_lines']==0,'Startup verification failed'
          PYCODE
